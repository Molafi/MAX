<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b13" />
  <title>MAX — AI Chat</title>
  <meta name="description" content="MAX — a premium AI chat assistant." />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Syntax highlighting theme (swapped at runtime for light mode) -->
  <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============================ Animated background ============================ -->
  <div class="bg" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
  </div>

  <!-- ============================ App shell ============================ -->
  <div class="app" id="app">

    <!-- ---------- Sidebar ---------- -->
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="sidebar__head">
        <div class="brand">
          <span class="brand__logo" aria-hidden="true">
            <!-- Premium animated "L" logo -->
            <svg viewBox="0 0 64 64" class="logo-svg" role="img" aria-label="MAX logo">
              <defs>
                <linearGradient id="lgrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="var(--accent-1)"/>
                  <stop offset="55%" stop-color="var(--accent-2)"/>
                  <stop offset="100%" stop-color="var(--accent-3)"/>
                </linearGradient>
                <filter id="lglow" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="2.6" result="b"/>
                  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>
              <rect class="logo-plate" x="4" y="4" width="56" height="56" rx="16"/>
              <path class="logo-l" filter="url(#lglow)"
                d="M23 15 L23 42 L45 42"
                fill="none" stroke="url(#lgrad)" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
              <circle class="logo-spark" r="2.4" fill="#fff"/>
            </svg>
          </span>
          <div class="brand__text">
            <span class="brand__name">MAX</span>
            <span class="brand__tag">AI Assistant</span>
          </div>
        </div>
        <button class="icon-btn sidebar__collapse" id="collapse-btn" title="Hide sidebar" aria-label="Hide sidebar">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="new-chat-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>

      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="search-input" placeholder="Search conversations" autocomplete="off" />
      </div>

      <nav class="conversations" id="conversation-list" aria-label="Conversation history"></nav>

      <div class="sidebar__foot">
        <button class="foot-btn" id="theme-btn" title="Toggle theme">
          <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <span class="foot-btn__label">Theme</span>
        </button>
        <button class="foot-btn" id="settings-btn" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008.8 19a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1A1.6 1.6 0 005 8.8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H11a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V11a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
          <span class="foot-btn__label">Settings</span>
        </button>
      </div>
    </aside>

    <!-- ---------- Main ---------- -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" title="Show sidebar" aria-label="Show sidebar">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar__center">
          <button class="model-pill" id="model-pill" title="Change model">
            <span class="model-pill__dot"></span>
            <span id="model-pill-name">claude-sonnet-4-6</span>
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
        <div class="topbar__right">
          <span class="key-status" id="key-status" title="API key status"></span>
        </div>
      </header>

      <!-- Chat scroll region -->
      <section class="chat" id="chat" aria-live="polite">
        <!-- Welcome / empty state -->
        <div class="welcome" id="welcome">
          <div class="welcome__logo">
            <svg viewBox="0 0 64 64" class="logo-svg logo-svg--xl" aria-hidden="true">
              <defs>
                <linearGradient id="lgrad2" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="var(--accent-1)"/>
                  <stop offset="55%" stop-color="var(--accent-2)"/>
                  <stop offset="100%" stop-color="var(--accent-3)"/>
                </linearGradient>
              </defs>
              <rect class="logo-plate" x="4" y="4" width="56" height="56" rx="16"/>
              <path class="logo-l logo-l--draw"
                d="M23 15 L23 42 L45 42"
                fill="none" stroke="url(#lgrad2)" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1 class="welcome__title">Meet <span class="grad-text">MAX</span></h1>
          <p class="welcome__sub">Your premium AI companion. Ask anything — code, ideas, writing, or a quick chat.</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion" data-prompt="Explain how JavaScript promises work with a clear example.">
              <span class="suggestion__icon">✦</span>
              <span><b>Explain a concept</b>How do JavaScript promises work?</span>
            </button>
            <button class="suggestion" data-prompt="Write a Python function that returns the nth Fibonacci number, with comments.">
              <span class="suggestion__icon">⌘</span>
              <span><b>Write some code</b>A Python Fibonacci function</span>
            </button>
            <button class="suggestion" data-prompt="Give me 5 creative name ideas for a productivity app, with a one-line pitch each.">
              <span class="suggestion__icon">✎</span>
              <span><b>Brainstorm ideas</b>Names for a productivity app</span>
            </button>
            <button class="suggestion" data-prompt="Summarize the key differences between HTTP/1.1, HTTP/2, and HTTP/3.">
              <span class="suggestion__icon">◈</span>
              <span><b>Summarize</b>HTTP/1.1 vs 2 vs 3</span>
            </button>
          </div>
        </div>

        <!-- Messages get injected here -->
        <div class="messages" id="messages"></div>
      </section>

      <!-- Scroll-to-bottom pill -->
      <button class="scroll-bottom" id="scroll-bottom" title="Scroll to latest" aria-label="Scroll to latest">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </button>

      <!-- ---------- Composer ---------- -->
      <div class="composer-wrap">
        <div class="attachments" id="attachments"></div>
        <form class="composer" id="composer">
          <button type="button" class="icon-btn composer__attach" id="attach-btn" title="Attach image">
            <svg viewBox="0 0 24 24"><path d="M21 12.5V7a4 4 0 00-8 0v9a2.5 2.5 0 005 0V8"/></svg>
          </button>
          <input type="file" id="file-input" accept="image/*" multiple hidden />
          <textarea id="input" class="composer__input" rows="1"
            placeholder="Message MAX…" autocomplete="off" autofocus></textarea>
          <div class="composer__meta">
            <span class="char-count" id="char-count">0</span>
          </div>
          <button type="button" class="stop-btn" id="stop-btn" title="Stop generating" hidden>
            <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
          <button type="submit" class="send-btn" id="send-btn" title="Send (Enter)" disabled>
            <svg viewBox="0 0 24 24"><path d="M7 11l5-5 5 5M12 6v13"/></svg>
          </button>
        </form>
        <p class="composer__hint">MAX can make mistakes. Enter to send · Shift+Enter for a new line.</p>
      </div>
    </main>
  </div>

  <!-- ============================ Settings modal ============================ -->
  <div class="modal-overlay" id="settings-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal__head">
        <h2 id="settings-title">Settings</h2>
        <button class="icon-btn" id="settings-close" aria-label="Close settings">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal__body">

        <div class="field" id="apikey-field">
          <label for="set-apikey">API key <span class="field__opt">(stored only in this browser)</span></label>
          <div class="input-icon">
            <input type="password" id="set-apikey" placeholder="sk-…" autocomplete="off" />
            <button type="button" class="reveal-btn" id="reveal-key" title="Show/hide">👁</button>
          </div>
          <p class="field__help" id="apikey-help"></p>
        </div>

        <div class="field">
          <label for="set-model">Model</label>
          <select id="set-model"></select>
          <input type="text" id="set-model-custom" class="mt8" placeholder="…or type a custom model id" />
        </div>

        <div class="field">
          <label for="set-system">System prompt <span class="field__opt">(persona / behavior)</span></label>
          <textarea id="set-system" rows="4" placeholder="You are MAX, a helpful, friendly and concise assistant."></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="set-maxtokens">Max tokens</label>
            <input type="number" id="set-maxtokens" min="256" max="64000" step="256" />
          </div>
          <div class="field">
            <label for="set-temp">Temperature <span class="field__val" id="temp-val">1.0</span></label>
            <input type="range" id="set-temp" min="0" max="1" step="0.05" />
          </div>
        </div>

        <div class="field">
          <label>Danger zone</label>
          <div class="danger-row">
            <button class="btn btn--ghost" id="clear-current">Clear current chat</button>
            <button class="btn btn--danger" id="delete-all">Delete all conversations</button>
          </div>
        </div>

      </div>
      <div class="modal__foot">
        <span class="modal__note" id="settings-note"></span>
        <button class="btn btn--primary" id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Rename dialog -->
  <div class="modal-overlay" id="rename-overlay" hidden>
    <div class="modal modal--sm" role="dialog" aria-modal="true">
      <div class="modal__head"><h2>Rename conversation</h2></div>
      <div class="modal__body">
        <div class="field">
          <input type="text" id="rename-input" maxlength="80" />
        </div>
      </div>
      <div class="modal__foot">
        <button class="btn btn--ghost" id="rename-cancel">Cancel</button>
        <button class="btn btn--primary" id="rename-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast host -->
  <div class="toast-host" id="toast-host" aria-live="assertive"></div>

  <!-- Libraries: markdown, sanitizer, syntax highlight (loaded from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <script src="bg.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
