<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b13" />
  <title>Sign in · MAX</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: grid; place-items: center; padding: 24px; overflow: auto; }
    .login-card {
      position: relative; z-index: 1; width: 100%; max-width: 400px;
      background: var(--surface); backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid var(--border-strong); border-radius: 22px; padding: 34px 30px;
      box-shadow: var(--shadow); animation: modalIn .4s var(--ease);
    }
    .login-logo { width: 60px; height: 60px; margin: 0 auto 16px; }
    .login-title { text-align: center; font-size: 26px; font-weight: 800; margin: 0 0 4px; }
    .login-sub { text-align: center; color: var(--text-dim); font-size: 14px; margin: 0 0 26px; }
    .login-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
    .login-field label { font-size: 13px; font-weight: 600; }
    .login-field input {
      width: 100%; padding: 12px 14px; border-radius: 11px; background: var(--surface-2);
      border: 1px solid var(--border-strong); color: var(--text); font-size: 15px;
    }
    .login-field input:focus { outline: none; border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(124,92,255,.16); }
    .login-btn {
      width: 100%; padding: 13px; border-radius: 12px; border: none; color: #fff; font-size: 15px; font-weight: 700;
      background: var(--accent-grad); box-shadow: 0 10px 26px -10px var(--accent-1); transition: transform .15s, opacity .2s;
    }
    .login-btn:hover { transform: translateY(-1px); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .login-error { min-height: 20px; text-align: center; color: #ff6b8a; font-size: 13.5px; margin-top: 14px; }
    .login-foot { text-align: center; margin-top: 22px; font-size: 12px; color: var(--text-faint); }
    .grad-text { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
    <div class="bg-grid"></div>
  </div>

  <form class="login-card" id="login-form" method="post" action="/api/auth/login">
    <div class="login-logo">
      <svg viewBox="0 0 64 64" class="logo-svg logo-svg--xl" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent-1)"/>
            <stop offset="55%" stop-color="var(--accent-2)"/>
            <stop offset="100%" stop-color="var(--accent-3)"/>
          </linearGradient>
        </defs>
        <rect class="logo-plate" x="4" y="4" width="56" height="56" rx="16"/>
        <path class="logo-l logo-l--draw" d="M23 15 L23 42 L45 42" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="login-title">Welcome to <span class="grad-text">MAX</span></h1>
    <p class="login-sub">Sign in to continue</p>

    <div class="login-field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required />
    </div>
    <div class="login-field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </div>

    <button type="submit" class="login-btn" id="login-btn">Sign in</button>
    <div class="login-error" id="login-error" role="alert"></div>
    <p class="login-foot">First time here? Sign in with <b>admin</b> / <b>admin</b>, then change your password.</p>
  </form>

  <script src="login.js" defer></script>
</body>
</html>
